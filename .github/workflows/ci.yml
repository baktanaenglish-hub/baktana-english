name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Server deps are installed with `npm ci` below instead of the root postinstall.
      SKIP_SERVER_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Detect server package
        id: server
        run: |
          if [ -f server/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install server dependencies
        if: steps.server.outputs.exists == 'true'
        run: |
          if [ -f server/package-lock.json ]; then npm ci --prefix server; else npm install --prefix server; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (informational)
        run: npm run format:check
        continue-on-error: true

      - name: Test (web)
        run: npm run test:web

      - name: Test (server)
        if: steps.server.outputs.exists == 'true'
        run: npm --prefix server test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        if: hashFiles('server/package.json') != ''
        run: docker build -t baktana-english:ci .
