# Keeps Supabase in step with the repo: schema.sql, Edge Function secrets and functions.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens);
# ANTHROPIC_API_KEY, PREMIUM_EMAILS, TESTER_EMAILS, REVENUECAT_WEBHOOK_SECRET and REVENUECAT_API_KEY are optional
# secrets that are copied to the functions.
name: Supabase

on:
  push:
    branches: [main, ccr-37fc634b-8x1foh]
    paths:
      - 'supabase/**'
      - 'shared/call*.ts'
      - 'shared/premium.ts'
      - 'shared/billing.ts'
      - '.github/scripts/supabase-deploy.sh'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" asks GitHub for the newest version and fails when rate limited.
          version: 2.121.0
      - name: Update Supabase (SQL + secrets + functions)
        run: .github/scripts/supabase-deploy.sh
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREMIUM_EMAILS: ${{ secrets.PREMIUM_EMAILS }}
          TESTER_EMAILS: ${{ secrets.TESTER_EMAILS }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          CALL_MODEL: ${{ vars.CALL_MODEL }}
