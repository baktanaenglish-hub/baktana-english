apply plugin: 'com.android.application'

android {
    namespace = "com.baktana.english"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.baktana.english"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the workflow run number so every new APK installs over the previous one.
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1.0.${System.getenv("VERSION_CODE") ?: "0"}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // Two editions of the same app (docs/android.md, docs/store-release.md):
    // - sideload: the APK on GitHub releases, which updates itself from there (AppUpdatePlugin).
    // - play: the Google Play build. Play delivers updates, so self-update and its
    //   REQUEST_INSTALL_PACKAGES permission are left out (src/play/AndroidManifest.xml).
    flavorDimensions = ["store"]
    productFlavors {
        sideload {
            dimension "store"
            // The GitHub APK gets its own id, so it can sit next to the Play edition.
            applicationIdSuffix ".sideload"
            buildConfigField "boolean", "IN_APP_UPDATES", "true"
        }
        play {
            dimension "store"
            // Keeps the default id, com.baktana.english (permanent once uploaded to Play).
            buildConfigField "boolean", "IN_APP_UPDATES", "false"
        }
    }
    signingConfigs {
        // A fixed key committed to the repo (Android debug-key convention, not a secret), so
        // APKs built on different machines share one signature and can update each other.
        // A store release needs its own private key – see docs/android.md.
        debug {
            storeFile file('baktana-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The private upload key for Google Play, only when CI (or you) provide it – see
        // docs/store-release.md. Never commit this key.
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
