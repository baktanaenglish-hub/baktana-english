<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f7cf2" />
    <meta name="description" content="לומדים אנגלית בכיף – שיעורים קצרים, נקודות ורצף יומי." />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Baktana English" />
    <title>Baktana English – לומדים אנגלית</title>
  </head>
  <body>
    <script>
      // Apply a saved light/dark choice before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('baktana-english:settings:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <noscript>כדי להשתמש ב־Baktana English צריך להפעיל JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA: register the service worker on deployed hosts only, so local dev never serves stale files.
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.addEventListener('load', () => navigator.serviceWorker.register('%BASE_URL%sw.js'));
      }
    </script>
  </body>
</html>
